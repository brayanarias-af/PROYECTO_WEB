<!-- ===== VISTA: PROFESORES ===== -->
<section class="vista" id="vista-profesores" aria-label="Profesores">

  <!-- Resumen -->
  <div class="pro-resumen pro-resumen--dos">
    <article class="pro-stat">
      <span class="pro-icono pro-icono--primario"><span class="material-icons-sharp">person_outline</span></span>
      <div>
        <h3>Total de profesores</h3>
        <h1 id="pro-total">0</h1>
      </div>
    </article>
    <article class="pro-stat">
      <span class="pro-icono pro-icono--exito"><span class="material-icons-sharp">how_to_reg</span></span>
      <div>
        <h3>Profesores activos</h3>
        <h1 id="pro-activos">0</h1>
      </div>
    </article>
  </div>

  <!-- Listado -->
  <div class="pro-panel">
    <div class="pro-toolbar">
      <label class="pro-buscador">
        <span class="material-icons-sharp">search</span>
        <input type="search" id="pro-buscar" placeholder="Buscar por nombre, materia o documento" autocomplete="off" />
      </label>

      <select id="pro-filtro-estado" aria-label="Filtrar por estado">
        <option value="Todos">Todos los estados</option>
        <option value="Activo">Activos</option>
        <option value="Retirado">Retirados</option>
      </select>

      <button type="button" id="pro-btn-nuevo" class="pro-btn pro-btn--primario">
        <span class="material-icons-sharp">add</span>
        Agregar profesor
      </button>
    </div>

    <div class="pro-tabla-wrap" id="pro-tabla-wrap">
      <table class="pro-tabla">
        <thead>
          <tr>
            <th>Profesor</th>
            <th>Documento</th>
            <th>Materia</th>
            <th>Estado</th>
            <th class="pro-col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="pro-tbody"></tbody>
      </table>
    </div>

    <div class="pro-vacio" id="pro-vacio" hidden>
      <span class="material-icons-sharp">person_search</span>
      <h3 id="pro-vacio-titulo">Aún no hay profesores</h3>
      <p id="pro-vacio-texto">Agrega el primer profesor para empezar.</p>
    </div>
  </div>

  <!-- Modal crear / editar -->
  <dialog id="pro-modal" aria-labelledby="pro-modal-titulo">
    <form id="pro-form" novalidate>
      <header class="pro-modal-head">
        <h2 id="pro-modal-titulo">Agregar profesor</h2>
        <button type="button" class="pro-icono-btn" id="pro-cerrar" aria-label="Cerrar">
          <span class="material-icons-sharp">close</span>
        </button>
      </header>

      <div class="pro-campos">
        <div class="pro-campo pro-campo--ancho">
          <label for="pro-nombre">Nombre completo</label>
          <input type="text" id="pro-nombre" required minlength="3" autocomplete="off" />
        </div>

        <div class="pro-campo">
          <label for="pro-documento">Documento</label>
          <input type="text" id="pro-documento" inputmode="numeric" required autocomplete="off" />
        </div>

        <div class="pro-campo">
          <label for="pro-materia">Materia</label>
          <input type="text" id="pro-materia" required autocomplete="off" />
        </div>

        <div class="pro-campo pro-campo--ancho">
          <label for="pro-correo">Correo</label>
          <input type="email" id="pro-correo" required autocomplete="off" />
        </div>

        <div class="pro-campo pro-campo--ancho">
          <label for="pro-clave">Contraseña</label>
          <div class="pro-clave-wrap">
            <input type="password" id="pro-clave" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
            <button type="button" class="pro-icono-btn" id="pro-ver-clave" aria-label="Mostrar contraseña">
              <span class="material-icons-sharp">visibility</span>
            </button>
          </div>
          <small class="pro-ayuda" id="pro-clave-ayuda"></small>
        </div>

        <div class="pro-campo">
          <label for="pro-estado">Estado</label>
          <select id="pro-estado">
            <option value="Activo">Activo</option>
            <option value="Retirado">Retirado</option>
          </select>
        </div>
      </div>

      <p class="pro-error" id="pro-error" role="alert" hidden></p>

      <footer class="pro-modal-pie">
        <button type="button" class="pro-btn pro-btn--suave" id="pro-cancelar">Cancelar</button>
        <button type="submit" class="pro-btn pro-btn--primario" id="pro-guardar">Guardar profesor</button>
      </footer>
    </form>
  </dialog>

</section>
