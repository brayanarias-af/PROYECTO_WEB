<!-- ===== VISTA: GESTIÓN DE USUARIOS =====
     Busca a un estudiante o profesor por su ID (documento o código) y lo edita. -->
<section class="vista" id="vista-usuarios" aria-label="Gestión de usuarios">

  <div class="usr-panel">
    <h2 class="usr-titulo">Buscar usuario por ID</h2>
    <p class="usr-ayuda">Escribe el documento (ej. <b>1234567</b>) o el código (ej. <b>EST-001</b>) para encontrar a un estudiante o profesor y editarlo.</p>

    <form class="usr-busqueda" id="usr-busqueda" role="search">
      <label class="usr-buscador">
        <span class="material-icons-sharp">badge</span>
        <input type="search" id="usr-id" placeholder="ID del usuario" autocomplete="off" inputmode="search" aria-label="ID del usuario" />
      </label>
      <button type="submit" class="usr-btn usr-btn--primario">
        <span class="material-icons-sharp">search</span>
        Buscar
      </button>
    </form>
  </div>

  <div class="usr-resultados" id="usr-resultados" aria-live="polite"></div>

  <!-- Modal editar -->
  <dialog id="usr-modal" aria-labelledby="usr-modal-titulo">
    <form id="usr-form" novalidate>
      <header class="usr-modal-head">
        <h2 id="usr-modal-titulo">Editar usuario</h2>
        <button type="button" class="usr-icono-btn" id="usr-cerrar" aria-label="Cerrar">
          <span class="material-icons-sharp">close</span>
        </button>
      </header>

      <div class="usr-campos">
        <div class="usr-campo usr-campo--ancho">
          <label for="usr-nombre">Nombre completo</label>
          <input type="text" id="usr-nombre" required minlength="3" autocomplete="off" />
        </div>
        <div class="usr-campo">
          <label for="usr-documento">Documento</label>
          <input type="text" id="usr-documento" inputmode="numeric" required autocomplete="off" />
        </div>
        <div class="usr-campo" id="usr-campo-grado">
          <label for="usr-grado">Grado</label>
          <input type="text" id="usr-grado" list="usr-grados" autocomplete="off" />
          <datalist id="usr-grados">
            <option value="6°"></option><option value="7°"></option><option value="8°"></option>
            <option value="9°"></option><option value="10°"></option><option value="11°"></option>
          </datalist>
        </div>
        <div class="usr-campo" id="usr-campo-materia" hidden>
          <label for="usr-materia">Materia</label>
          <input type="text" id="usr-materia" autocomplete="off" />
        </div>
        <div class="usr-campo usr-campo--ancho">
          <label for="usr-correo">Correo</label>
          <input type="email" id="usr-correo" required autocomplete="off" />
        </div>
        <div class="usr-campo usr-campo--ancho">
          <label for="usr-clave">Nueva contraseña</label>
          <div class="usr-clave-wrap">
            <input type="password" id="usr-clave" minlength="6" autocomplete="new-password" placeholder="Déjala vacía para no cambiarla" />
            <button type="button" class="usr-icono-btn" id="usr-ver-clave" aria-label="Mostrar contraseña">
              <span class="material-icons-sharp">visibility</span>
            </button>
          </div>
        </div>
        <div class="usr-campo">
          <label for="usr-estado">Estado</label>
          <select id="usr-estado">
            <option value="Activo">Activo</option>
            <option value="Retirado">Retirado</option>
          </select>
        </div>
      </div>

      <p class="usr-error" id="usr-error" role="alert" hidden></p>

      <footer class="usr-modal-pie">
        <button type="button" class="usr-btn usr-btn--suave" id="usr-cancelar">Cancelar</button>
        <button type="submit" class="usr-btn usr-btn--primario">Guardar cambios</button>
      </footer>
    </form>
  </dialog>
</section>
