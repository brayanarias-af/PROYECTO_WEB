<!-- ===== VISTA: ESTUDIANTES =====-->
<section class="vista" id="vista-estudiantes" aria-label="Estudiantes">

  <!-- Resumen -->
  <div class="est-resumen">
    <article class="est-stat">
      <span class="est-icono est-icono--primario"><span class="material-icons-sharp">school</span></span>
      <div>
        <h3>Total de estudiantes</h3>
        <h1 id="est-total">0</h1>
      </div>
    </article>
    <article class="est-stat">
      <span class="est-icono est-icono--exito"><span class="material-icons-sharp">how_to_reg</span></span>
      <div>
        <h3>Estudiantes activos</h3>
        <h1 id="est-activos">0</h1>
      </div>
    </article>
    <article class="est-stat">
      <span class="est-icono est-icono--alerta"><span class="material-icons-sharp">trending_down</span></span>
      <div>
        <h3>Promedio bajo (&lt; 3.0)</h3>
        <h1 id="est-bajos">0</h1>
      </div>
    </article>
  </div>

  <!-- Listado -->
  <div class="est-panel">
    <div class="est-toolbar">
      <label class="est-buscador">
        <span class="material-icons-sharp">search</span>
        <input type="search" id="est-buscar" placeholder="Buscar por nombre, código o documento" autocomplete="off" />
      </label>

      <select id="est-filtro-estado" aria-label="Filtrar por estado">
        <option value="Todos">Todos los estados</option>
        <option value="Activo">Activos</option>
        <option value="Retirado">Retirados</option>
      </select>

      <select id="est-filtro-grado" aria-label="Filtrar por grado">
        <option value="Todos">Todos los grados</option>
      </select>

      <button type="button" id="est-btn-nuevo" class="est-btn est-btn--primario">
        <span class="material-icons-sharp">add</span>
        Agregar estudiante
      </button>
    </div>

    <div class="est-tabla-wrap" id="est-tabla-wrap">
      <table class="est-tabla">
        <thead>
          <tr>
            <th>Estudiante</th>
            <th>Código</th>
            <th>Grado</th>
            <th>Promedio</th>
            <th>Estado</th>
            <th class="est-col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="est-tbody"></tbody>
      </table>
    </div>

    <div class="est-vacio" id="est-vacio" hidden>
      <span class="material-icons-sharp">person_search</span>
      <h3 id="est-vacio-titulo">Aún no hay estudiantes</h3>
      <p id="est-vacio-texto">Agrega el primer estudiante para empezar a gestionar sus notas.</p>
    </div>
  </div>

  <!-- Modal crear / editar -->
  <dialog id="est-modal" aria-labelledby="est-modal-titulo">
    <form id="est-form" novalidate>
      <header class="est-modal-head">
        <h2 id="est-modal-titulo">Agregar estudiante</h2>
        <button type="button" class="est-icono-btn" id="est-cerrar" aria-label="Cerrar">
          <span class="material-icons-sharp">close</span>
        </button>
      </header>

      <div class="est-campos">
        <div class="est-campo est-campo--ancho">
          <label for="est-nombre">Nombre completo</label>
          <input type="text" id="est-nombre" required minlength="3" autocomplete="off" />
        </div>

        <div class="est-campo">
          <label for="est-documento">Documento</label>
          <input type="text" id="est-documento" inputmode="numeric" required autocomplete="off" />
        </div>

        <div class="est-campo">
          <label for="est-grado">Grado</label>
          <input type="text" id="est-grado" list="est-grados" required autocomplete="off" />
          <datalist id="est-grados">
            <option value="6°"></option><option value="7°"></option><option value="8°"></option>
            <option value="9°"></option><option value="10°"></option><option value="11°"></option>
          </datalist>
        </div>

        <div class="est-campo est-campo--ancho">
          <label for="est-correo">Correo</label>
          <input type="email" id="est-correo" required autocomplete="off" />
        </div>

        <div class="est-campo est-campo--ancho">
          <label for="est-clave">Contraseña</label>
          <div class="est-clave-wrap">
            <input type="password" id="est-clave" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
            <button type="button" class="est-icono-btn" id="est-ver-clave" aria-label="Mostrar contraseña">
              <span class="material-icons-sharp">visibility</span>
            </button>
          </div>
          <small class="est-ayuda" id="est-clave-ayuda"></small>
        </div>

        <div class="est-campo">
          <label for="est-estado">Estado</label>
          <select id="est-estado">
            <option value="Activo">Activo</option>
            <option value="Retirado">Retirado</option>
          </select>
        </div>
      </div>

      <p class="est-error" id="est-error" role="alert" hidden></p>

      <footer class="est-modal-pie">
        <button type="button" class="est-btn est-btn--suave" id="est-cancelar">Cancelar</button>
        <button type="submit" class="est-btn est-btn--primario" id="est-guardar">Guardar estudiante</button>
      </footer>
    </form>
  </dialog>

</section>
