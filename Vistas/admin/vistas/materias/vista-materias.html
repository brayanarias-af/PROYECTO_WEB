<!-- ===== VISTA: MATERIAS ===== -->
<section class="vista" id="vista-materias" aria-label="Materias">

  <div class="mat-resumen">
    <article class="mat-stat">
      <span class="mat-icono mat-icono--primario"><span class="material-icons-sharp">menu_book</span></span>
      <div><h3>Total de materias</h3><h1 id="mat-total">0</h1></div>
    </article>
    <article class="mat-stat">
      <span class="mat-icono mat-icono--exito"><span class="material-icons-sharp">check_circle</span></span>
      <div><h3>Materias activas</h3><h1 id="mat-activas">0</h1></div>
    </article>
    <article class="mat-stat">
      <span class="mat-icono mat-icono--alerta"><span class="material-icons-sharp">person_off</span></span>
      <div><h3>Sin profesor asignado</h3><h1 id="mat-sinprof">0</h1></div>
    </article>
  </div>

  <div class="mat-panel">
    <div class="mat-toolbar">
      <label class="mat-buscador">
        <span class="material-icons-sharp">search</span>
        <input type="search" id="mat-buscar" placeholder="Buscar por nombre o código" autocomplete="off" />
      </label>
      <select id="mat-filtro-estado" aria-label="Filtrar por estado">
        <option value="Todos">Todos los estados</option>
        <option value="Activa">Activas</option>
        <option value="Inactiva">Inactivas</option>
      </select>
      <select id="mat-filtro-grado" aria-label="Filtrar por grado">
        <option value="Todos">Todos los grados</option>
      </select>
      <button type="button" id="mat-btn-nuevo" class="mat-btn mat-btn--primario">
        <span class="material-icons-sharp">add</span>
        Agregar materia
      </button>
    </div>

    <div class="mat-tabla-wrap" id="mat-tabla-wrap">
      <table class="mat-tabla">
        <thead>
          <tr>
            <th>Materia</th>
            <th>Código</th>
            <th>Grado</th>
            <th>Profesor</th>
            <th>Estado</th>
            <th class="mat-col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="mat-tbody"></tbody>
      </table>
    </div>

    <div class="mat-vacio" id="mat-vacio" hidden>
      <span class="material-icons-sharp">menu_book</span>
      <h3 id="mat-vacio-titulo">Aún no hay materias</h3>
      <p id="mat-vacio-texto">Agrega la primera materia para poder asignarle profesor y notas.</p>
    </div>
  </div>

  <dialog id="mat-modal" aria-labelledby="mat-modal-titulo">
    <form id="mat-form" novalidate>
      <header class="mat-modal-head">
        <h2 id="mat-modal-titulo">Agregar materia</h2>
        <button type="button" class="mat-icono-btn" id="mat-cerrar" aria-label="Cerrar">
          <span class="material-icons-sharp">close</span>
        </button>
      </header>

      <div class="mat-campos">
        <div class="mat-campo mat-campo--ancho">
          <label for="mat-nombre">Nombre de la materia</label>
          <input type="text" id="mat-nombre" required autocomplete="off" placeholder="Ej. Programación web" />
        </div>
        <div class="mat-campo">
          <label for="mat-grado">Grado</label>
          <input type="text" id="mat-grado" list="mat-grados" required autocomplete="off" />
          <datalist id="mat-grados">
            <option value="6°"></option><option value="7°"></option><option value="8°"></option>
            <option value="9°"></option><option value="10°"></option><option value="11°"></option>
          </datalist>
        </div>
        <div class="mat-campo">
          <label for="mat-estado">Estado</label>
          <select id="mat-estado">
            <option value="Activa">Activa</option>
            <option value="Inactiva">Inactiva</option>
          </select>
        </div>
        <div class="mat-campo mat-campo--ancho">
          <label for="mat-profesor">Profesor</label>
          <select id="mat-profesor"></select>
        </div>
      </div>

      <p class="mat-error" id="mat-error" role="alert" hidden></p>

      <footer class="mat-modal-pie">
        <button type="button" class="mat-btn mat-btn--suave" id="mat-cancelar">Cancelar</button>
        <button type="submit" class="mat-btn mat-btn--primario">Guardar materia</button>
      </footer>
    </form>
  </dialog>
</section>
