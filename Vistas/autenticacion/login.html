<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colegio Nova | Inicio de sesión</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/style.login.css" />
</head>

<body>
    <!-- Selector de tema-->
    <div class="theme-toggler" id="theme-toggler" role="button" tabindex="0" aria-label="Cambiar tema">
        <span class="material-icons-sharp active"> light_mode </span>
        <span class="material-icons-sharp"> dark_mode </span>
    </div>

    <main class="login-page">
        <section class="login-card" aria-labelledby="login-titulo">
            <div class="login-logo-caja">
                <img class="login-logo" src="../../img/img.login/logo-nova.png" alt="Logo Colegio Nova" />
            </div>

            <h1 id="login-titulo">Inicio de sesión</h1>

            <form id="login-form" novalidate>
                <div class="campo">
                    <label for="correo">Correo</label>
                    <div class="campo-input">
                        <span class="material-icons-sharp">mail_outline</span>
                        <input type="email" id="correo" name="correo" placeholder="nombre@correo.com"
                            autocomplete="username" required />
                    </div>
                </div>

                <div class="campo">
                    <label for="clave">Contraseña</label>
                    <div class="campo-input">
                        <span class="material-icons-sharp">lock_outline</span>
                        <input type="password" id="clave" name="clave" placeholder="Tu contraseña"
                            autocomplete="current-password" required />
                        <button type="button" class="ver-clave" id="ver-clave" aria-label="Mostrar contraseña">
                            <span class="material-icons-sharp">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="opciones">
                    <label class="recordar">
                        <input type="checkbox" id="recordar" />
                        Recordar mi correo
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <p class="login-error" id="login-error" role="alert" hidden></p>

                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>
        </section>

        <small class="login-pie">© 2026 Colegio Nova</small>
    </main>

    <script src="../../js/login.js"></script>
</body>

</html>
